<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teknesyum Bileşen Önizleme</title>
<link rel="stylesheet" href="/standart.css">
<link rel="stylesheet" href="/stil.css">
<script src="/kontrast.js" defer></script>
<script src="/skor.js" defer></script>
<script src="/akicilik.js" defer></script>
<script src="/teknik.js" defer></script>
<script src="/uygulama.js" defer></script>
</head>
<body>
<header class="tk-titlebar uygulama-cubuk">
  <div class="tk-titlebar__brand">
    <h1 class="tk-titlebar__name">Teknesyum<span class="tk-titlebar__accent">Önizleme</span></h1>
  </div>
  <nav class="tk-titlebar__tabs kip" aria-label="Görünüm Kipi">
    <button type="button" class="tk-titlebar__tab" data-kip="tek" aria-current="page" tabindex="0">Tek Görünüm</button>
    <button type="button" class="tk-titlebar__tab" data-kip="karsi" tabindex="-1">Önce / Sonra</button>
  </nav>
  <div class="tk-titlebar__tools">
    <select class="cubuk-sec tema-sec" id="tema-sec" aria-label="Tema"><option value="">Token Dosyası</option></select>
    <button type="button" class="tk-titlebar__chip" id="sifirla">Sıfırla</button>
    <button type="button" class="tk-titlebar__chip" id="kopyala">Kopyala</button>
    <button type="button" class="tk-titlebar__chip" id="indir">İndir</button>
    <button type="button" class="tk-titlebar__chip" id="kaydet">Kaydet</button>
    <div class="tk-titlebar__window" id="pencere-denetim" hidden>
      <button type="button" class="tk-titlebar__control" data-pencere="kucult" aria-label="Küçült" title="Küçült"><span class="tk-titlebar__minimize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control" data-pencere="buyut" aria-label="Büyüt" title="Büyüt"><span class="tk-titlebar__maximize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control tk-titlebar__control--close" data-pencere="kapat" aria-label="Kapat" title="Kapat"><span class="tk-titlebar__close" aria-hidden="true"></span></button>
    </div>
  </div>
</header>
<div class="duzen">
  <nav class="bilesen-liste" id="bilesen-liste" aria-label="Bileşenler"></nav>
  <main class="onizleme" id="onizleme" tabindex="-1" aria-label="Önizleme">
    <p class="yukleniyor">Token dosyası okunuyor…</p>
  </main>
  <aside class="sol sag" aria-label="Ayarlar">
    <form id="ayarlar" autocomplete="off"></form>
  </aside>
</div>
<p class="durum" id="durum" role="status" aria-live="polite"></p>
<div class="tk-window-edge" aria-hidden="true"></div>
<dialog class="kaydet-pencere" id="kaydet-pencere" aria-labelledby="kaydet-baslik"></dialog>
</body>
</html>
