<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teknesyum Bileşen Önizleme</title>
<link rel="stylesheet" href="/standart.css">
<link rel="stylesheet" href="/stil.css">
<script src="/kontrast.js" defer></script>
<script src="/skor.js" defer></script>
<script src="/akicilik.js" defer></script>
<script src="/teknik.js" defer></script>
<script src="/uygulama.js" defer></script>
</head>
<body>
<header class="ust">
  <h1 class="ust-baslik">Bileşen Önizleme</h1>
  <div class="ust-arac">
    <div class="kip" role="group" aria-label="Görünüm Kipi">
      <button type="button" class="arac-dugme" data-kip="tek" aria-pressed="true">Tek Görünüm</button>
      <button type="button" class="arac-dugme" data-kip="karsi" aria-pressed="false">Önce / Sonra</button>
    </div>
    <select class="giris tema-sec" id="tema-sec" aria-label="Tema"><option value="">Token Dosyası</option></select>
    <button type="button" class="arac-dugme" id="sifirla">Tümünü Sıfırla</button>
    <button type="button" class="arac-dugme" id="kopyala">Panoya Kopyala</button>
    <button type="button" class="arac-dugme" id="indir">İndir</button>
    <button type="button" class="arac-dugme arac-birincil" id="kaydet">Kaydet</button>
    <span class="durum" id="durum" role="status" aria-live="polite"></span>
  </div>
</header>
<div class="duzen">
  <nav class="bilesen-liste" id="bilesen-liste" aria-label="Bileşenler"></nav>
  <main class="onizleme" id="onizleme" tabindex="-1" aria-label="Önizleme">
    <p class="yukleniyor">Token dosyası okunuyor…</p>
  </main>
  <aside class="sol sag" aria-label="Ayarlar">
    <form id="ayarlar" autocomplete="off"></form>
  </aside>
</div>
<dialog class="kaydet-pencere" id="kaydet-pencere" aria-labelledby="kaydet-baslik"></dialog>
</body>
</html>
